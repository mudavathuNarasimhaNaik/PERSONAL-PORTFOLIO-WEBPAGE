<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a192f;
      color: #ccd6f6;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #112240;
    }

    .navbar-brand, .nav-link {
      color: #64ffda !important;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .contact-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      padding: 2rem;
    }

    .contact-image img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      max-height: 450px;
    }

    .contact-form {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
    }

    .contact-form h1 {
      color: #64ffda;
      margin-bottom: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 0.8rem;
      border-radius: 6px;
      border: none;
      background-color: #112240;
      color: #ccd6f6;
      resize: none;
    }

    button {
      background-color: #64ffda;
      color: #0a192f;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #52e0c4;
    }

    .contact-info {
      margin-top: 2rem;
      color: #8892b0;
    }

    .social-icons {
      margin-top: 1rem;
    }

    .social-icons a {
      margin-right: 10px;
      color: #64ffda;
      font-size: 1.5rem;
      text-decoration: none;
    }

    footer {
      background-color: #112240;
      color: #8892b0;
      text-align: center;
      padding: 1rem;
      margin-top: 3rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">My Portfolio</a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="certificates.html">Certificates</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Section -->
  <div class="contact-container container mt-5">
    <div class="contact-image col-md-6">
      <img src="https://media.istockphoto.com/id/2188133947/photo/contact-customer-support-businessman-use-smartphone-select-an-icon-help-from-mail-websites.jpg?s=1024x1024&w=is&k=20&c=1Mcop6wCmjXD0kx2vrb-gHc308b919GY8Sx48D9PtIM=" alt="Contact Image">
    </div>

    <div class="contact-form col-md-6">
      <h1>Contact Me</h1>
      <form action="#" method="POST">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>

      <div class="contact-info">
        <p><strong>Contact:</strong><br>narasimhanaik8602@gmail.com</p>
        <p><strong>Based in:</strong><br>Vinukonda, Andhra Pradesh</p>
        <div class="social-icons">
          <a href="#"><i class="bi bi-linkedin"></i></a>
          <a href="#"><i class="bi bi-facebook"></i></a>
          <a href="#"><i class="bi bi-instagram"></i></a>
          <a href="#"><i class="bi bi-twitter"></i></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Narasimha Naik | All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
